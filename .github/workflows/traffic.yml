name: Archive traffic data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and save traffic
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          REPO: sowmyachintakindi/PerfMLOps_Zero_Human_ML_Performance_Framework
        run: |
          mkdir -p traffic

          VIEWS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/traffic/views?per=day")
          CLONES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/traffic/clones?per=day")

          node -e "
            const fs = require('fs');

            // --- Save JSON ---
            function saveJSON(filename, newRows, key) {
              const history = fs.existsSync(filename)
                ? JSON.parse(fs.readFileSync(filename)) : [];
              const existing = new Set(history.map(r => r.timestamp));
              for (const row of newRows) {
                if (!existing.has(row.timestamp)) history.push(row);
              }
              history.sort((a, b) => a.timestamp.localeCompare(b.timestamp));
              fs.writeFileSync(filename, JSON.stringify(history, null, 2));
              return history;
            }

            const views = $VIEWS;
            const clones = $CLONES;

            const allViews  = saveJSON('traffic/views.json',  views.views   || [], 'views');
            const allClones = saveJSON('traffic/clones.json', clones.clones || [], 'clones');

            // --- Generate HTML table ---
            function tableRows(data) {
              return [...data].reverse().map(r => {
                const date = r.timestamp.split('T')[0];
                return '<tr><td>' + date + '</td><td>' + r.count + '</td><td>' + r.uniques + '</td></tr>';
              }).join('');
            }

            const html = '<!DOCTYPE html><html><head><title>Traffic Stats</title><style>'
              + 'body{font-family:sans-serif;max-width:900px;margin:40px auto;padding:0 20px}'
              + 'h2{margin-top:40px}'
              + 'table{width:100%;border-collapse:collapse}'
              + 'th,td{padding:10px;border:1px solid #ddd;text-align:left}'
              + 'th{background:#f5f5f5;font-weight:600}'
              + 'tr:nth-child(even){background:#fafafa}'
              + '.updated{color:#888;font-size:13px}'
              + '</style></head><body>'
              + '<h1>📊 Repo Traffic</h1>'
              + '<p class="updated">Last updated: ' + new Date().toUTCString() + '</p>'
              + '<h2>Views</h2>'
              + '<table><tr><th>Date</th><th>Total views</th><th>Unique visitors</th></tr>'
              + tableRows(allViews)
              + '</table>'
              + '<h2>Clones</h2>'
              + '<table><tr><th>Date</th><th>Total clones</th><th>Unique cloners</th></tr>'
              + tableRows(allClones)
              + '</table>'
              + '</body></html>';

            fs.writeFileSync('index.html', html);
          "

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic/ index.html
          git diff --cached --quiet || git commit -m "chore: archive traffic $(date +%F)"
          git push
