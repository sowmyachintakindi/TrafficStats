name: Archive traffic data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install canvas chart.js

      - name: Fetch and save traffic
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          mkdir -p traffic charts

          REPOS="sowmyachintakindi/PerfMLOps_Zero_Human_ML_Performance_Framework sowmyachintakindi/TrafficStats"

          for REPO in $REPOS; do
            SLUG=$(echo $REPO | cut -d'/' -f2)
            VIEWS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/traffic/views?per=day")
            CLONES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/traffic/clones?per=day")
            echo "$VIEWS"  > traffic/${SLUG}_views_raw.json
            echo "$CLONES" > traffic/${SLUG}_clones_raw.json
          done

          node -e "
            const fs = require('fs');
            const { createCanvas } = require('canvas');
            const { Chart } = require('chart.js/auto');

            const repos = 'sowmyachintakindi/PerfMLOps_Zero_Human_ML_Performance_Framework sowmyachintakindi/TrafficStats'.split(' ');
            const slugs = repos.map(r => r.split('/')[1]);
            const COLORS = ['#6366f1','#14b8a6','#f59e0b','#ef4444'];

            function buildCSV(type) {
              const filename = 'traffic/' + type + '.csv';
              const repoData = {};
              const allDates = new Set();

              slugs.forEach(slug => {
                const raw = JSON.parse(fs.readFileSync('traffic/' + slug + '_' + type + '_raw.json'));
                repoData[slug] = {};
                (raw[type] || []).forEach(r => {
                  const date = r.timestamp.split('T')[0];
                  repoData[slug][date] = { count: r.count, uniques: r.uniques };
                  allDates.add(date);
                });
              });

              let existingRows = {};
              if (fs.existsSync(filename)) {
                const lines = fs.readFileSync(filename, 'utf8').trim().split('\n');
                lines.slice(2).forEach(l => {
                  if (l.startsWith('TOTAL')) return;
                  const parts = l.split(',');
                  const date = parts[0];
                  allDates.add(date);
                  existingRows[date] = parts;
                });
              }

              const header1 = ['date', ...slugs.flatMap(s => [s, ''])];
              const header2 = ['date', ...slugs.flatMap(() => ['count', 'uniques'])];

              const sortedDates = [...allDates].filter(d => d).sort();
              const rows = sortedDates.map(date => {
                const existing = existingRows[date] || [];
                return [
                  date,
                  ...slugs.flatMap((slug, i) => {
                    const newData = repoData[slug][date];
                    if (newData) return [newData.count, newData.uniques];
                    const base = 1 + i * 2;
                    return [existing[base] || 0, existing[base + 1] || 0];
                  })
                ];
              });

              const totals = ['TOTAL', ...slugs.flatMap((slug, i) => {
                const base = 1 + i * 2;
                const tc = rows.reduce((s, r) => s + (parseInt(r[base])   || 0), 0);
                const tu = rows.reduce((s, r) => s + (parseInt(r[base+1]) || 0), 0);
                return [tc, tu];
              })];

              const content = header1.join(',') + '\n'
                + header2.join(',') + '\n'
                + rows.map(r => r.join(',')).join('\n') + '\n'
                + totals.join(',') + '\n';

              fs.writeFileSync(filename, content);
              return { rows, sortedDates, totals };
            }

            function generateChart(title, labels, datasets, outfile) {
              const width = 900, height = 400;
              const canvas = createCanvas(width, height);
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, width, height);

              new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                  responsive: false,
                  animation: false,
                  plugins: {
                    title: { display: true, text: title, font: { size: 16 } },
                    legend: { position: 'bottom' }
                  },
                  scales: {
                    x: { ticks: { maxRotation: 45 } },
                    y: { beginAtZero: true }
                  }
                }
              });

              fs.writeFileSync(outfile, canvas.toBuffer('image/png'));
            }

            function buildTableHeader(slugs) {
              const row1 = '<tr style=\"background:#f5f5f5\">'
                + '<th style=\"padding:8px 12px;border-bottom:1px solid #ddd\" rowspan=\"2\">Date</th>'
                + slugs.map(s =>
                    '<th colspan=\"2\" style=\"padding:8px 12px;border-bottom:1px solid #ddd;border-left:2px solid #ddd;text-align:center\">' + s + '</th>'
                  ).join('')
                + '</tr>';
              const row2 = '<tr style=\"background:#f5f5f5\">'
                + slugs.map(() =>
                    '<th style=\"padding:8px 12px;border-bottom:2px solid #ddd;border-left:2px solid #ddd;text-align:right\">Count</th>'
                    + '<th style=\"padding:8px 12px;border-bottom:2px solid #ddd;text-align:right\">Uniques</th>'
                  ).join('')
                + '</tr>';
              return row1 + row2;
            }

            function buildTableRows(rows, totals) {
              const dataRows = rows.map(r => {
                const cells = r.map((v, i) => {
                  const align = i === 0 ? '' : 'text-align:right;';
                  return '<td style=\"padding:8px 12px;border-bottom:1px solid #eee;' + align + '\">' + v + '</td>';
                }).join('');
                return '<tr>' + cells + '</tr>';
              }).join('');

              const totalCells = totals.map((v, i) => {
                const align = i === 0 ? '' : 'text-align:right;';
                return '<td style=\"padding:8px 12px;font-weight:600;background:#f0f0f0;' + align + '\">' + v + '</td>';
              }).join('');

              return dataRows + '<tr>' + totalCells + '</tr>';
            }

            const { rows: vRows, sortedDates: vDates, totals: vTotals } = buildCSV('views');
            const { rows: cRows, sortedDates: cDates, totals: cTotals } = buildCSV('clones');

            generateChart('Views per day', vDates,
              slugs.flatMap((slug, i) => [
                {
                  label: slug + ' views',
                  data: vRows.map(r => parseInt(r[1 + i * 2]) || 0),
                  borderColor: COLORS[i * 2],
                  backgroundColor: COLORS[i * 2] + '22',
                  tension: 0.3, fill: true
                },
                {
                  label: slug + ' uniques',
                  data: vRows.map(r => parseInt(r[2 + i * 2]) || 0),
                  borderColor: COLORS[i * 2 + 1],
                  borderDash: [5, 5],
                  tension: 0.3, fill: false
                }
              ]),
              'charts/views.png'
            );

            generateChart('Clones per day', cDates,
              slugs.flatMap((slug, i) => [
                {
                  label: slug + ' clones',
                  data: cRows.map(r => parseInt(r[1 + i * 2]) || 0),
                  borderColor: COLORS[i * 2],
                  backgroundColor: COLORS[i * 2] + '22',
                  tension: 0.3, fill: true
                },
                {
                  label: slug + ' unique cloners',
                  data: cRows.map(r => parseInt(r[2 + i * 2]) || 0),
                  borderColor: COLORS[i * 2 + 1],
                  borderDash: [5, 5],
                  tension: 0.3, fill: false
                }
              ]),
              'charts/clones.png'
            );

            const files = fs.readdirSync('traffic').filter(f => f.endsWith('_raw.json'));
            files.forEach(f => fs.unlinkSync('traffic/' + f));

            const totalCards = slugs.map((slug, i) => {
              const base = 1 + i * 2;
              const vc = vTotals[base]   || 0;
              const vu = vTotals[base+1] || 0;
              const cc = cTotals[base]   || 0;
              const cu = cTotals[base+1] || 0;
              return [
                '<div style=\"border:1px solid #ddd;border-radius:8px;padding:16px 20px;flex:1;min-width:200px\">',
                '<div style=\"font-weight:600;font-size:15px;margin-bottom:12px;color:#333\">' + slug + '</div>',
                '<table style=\"width:100%;border-collapse:collapse;font-size:13px\">',
                '<tr><td style=\"color:#888;padding:5px 0\">Total views</td><td style=\"text-align:right;font-weight:600;font-size:15px\">' + vc + '</td></tr>',
                '<tr><td style=\"color:#888;padding:5px 0\">Unique visitors</td><td style=\"text-align:right;font-weight:600;font-size:15px\">' + vu + '</td></tr>',
                '<tr><td style=\"color:#888;padding:5px 0\">Total clones</td><td style=\"text-align:right;font-weight:600;font-size:15px\">' + cc + '</td></tr>',
                '<tr><td style=\"color:#888;padding:5px 0\">Unique cloners</td><td style=\"text-align:right;font-weight:600;font-size:15px\">' + cu + '</td></tr>',
                '</table>',
                '</div>'
              ].join('');
            }).join('');

            const viewsTableHeader  = buildTableHeader(slugs);
            const viewsTableRows    = buildTableRows(vRows, vTotals);
            const clonesTableHeader = buildTableHeader(slugs);
            const clonesTableRows   = buildTableRows(cRows, cTotals);

            fs.writeFileSync('index.html', [
              '<!DOCTYPE html>',
              '<html>',
              '<head>',
              '<title>Traffic Stats</title>',
              '<style>',
              'body{font-family:sans-serif;max-width:960px;margin:40px auto;padding:0 20px}',
              'h2{margin-top:36px;margin-bottom:12px;font-size:18px;color:#333}',
              'img{width:100%;border:1px solid #eee;border-radius:8px;margin-bottom:8px}',
              '.updated{color:#888;font-size:13px;margin-bottom:28px}',
              '.cards{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0 32px}',
              '.table-wrap{overflow-x:auto;border:1px solid #ddd;bord
