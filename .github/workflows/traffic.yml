name: Archive traffic data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and save traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: sowmyachintakindi/PerfMLOps_Zero_Human_ML_Performance_Framework
          REPO1: ${{ github.repository }}
        run: |
          echo "Repo: $REPO"
          echo "Repo: $REPO1"
          echo "Token: ${GH_TOKEN}"
          echo "Token length: ${#GH_TOKEN}"

          mkdir -p traffic

          VIEWS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/traffic/views?per=day")
          echo "Views response: $VIEWS"

          CLONES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/traffic/clones?per=day")
          echo "Clones response: $CLONES"

          node -e "
            const fs = require('fs');
            const views = $VIEWS;
            const clones = $CLONES;

            for (const [name, data] of [['views', views], ['clones', clones]]) {
              const file = 'traffic/' + name + '.json';
              const history = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file)) : [];
              const existing = new Set(history.map(r => r.timestamp));
              for (const row of data[name] || []) {
                if (!existing.has(row.timestamp)) history.push(row);
              }
              fs.writeFileSync(file, JSON.stringify(history, null, 2));
            }
          "

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic/
          git diff --cached --quiet || git commit -m "chore: archive traffic $(date +%F)"
          git push
