name: Archive traffic data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install canvas chart.js

      - name: Fetch and save traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          mkdir -p traffic charts

          REPOS="sowmyachintakindi/PerfMLOps_Zero_Human_ML_Performance_Framework sowmyachintakindi/Near_Future_Performance_Prediction_Using_PyTorch_Deep_Learning_Framework sowmyachintakindi/Energy_Proportional_AI_Load_Balancing sowmyachintakindi/Elastic_ML_Training_Infrastructure sowmyachintakindi/API_onPrem_vs_AWSEC2_vs_AWSLambda"

          for REPO in $REPOS; do
            SLUG=$(echo $REPO | cut -d'/' -f2)
            VIEWS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/traffic/views?per=day")
            CLONES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/traffic/clones?per=day")
            echo "$VIEWS"  > traffic/${SLUG}_views_raw.json
            echo "$CLONES" > traffic/${SLUG}_clones_raw.json
          done

          node -e "
            const fs = require('fs');
            const { createCanvas } = require('canvas');
            const { Chart } = require('chart.js/auto');

            const repos = 'sowmyachintakindi/PerfMLOps_Zero_Human_ML_Performance_Framework sowmyachintakindi/Near_Future_Performance_Prediction_Using_PyTorch_Deep_Learning_Framework sowmyachintakindi/Energy_Proportional_AI_Load_Balancing sowmyachintakindi/Elastic_ML_Training_Infrastructure sowmyachintakindi/API_onPrem_vs_AWSEC2_vs_AWSLambda'.split(' ');
            const slugs = repos.map(r => r.split('/')[1]);
            const COLORS = ['#6366f1','#14b8a6','#f59e0b','#ef4444'];

            function buildCSV(type) {
              const filename = 'traffic/' + type + '.csv';
              const repoData = {};
              const allDates = new Set();

              slugs.forEach(slug => {
                const raw = JSON.parse(fs.readFileSync('traffic/' + slug + '_' + type + '_raw.json'));
                repoData[slug] = {};
                (raw[type] || []).forEach(r => {
                  const date = r.timestamp.split('T')[0];
                  repoData[slug][date] = { count: r.count, uniques: r.uniques };
                  allDates.add(date);
                });
              });

              let existingRows = {};
              if (fs.existsSync(filename)) {
                const lines = fs.readFileSync(filename, 'utf8').trim().split('\n');
                lines.slice(2).forEach(l => {
                  if (l.startsWith('TOTAL')) return;
                  const parts = l.split(',');
                  const date = parts[0];
                  allDates.add(date);
                  existingRows[date] = parts;
                });
              }

              const header1 = ['date', ...slugs.flatMap(s => [s, ''])];
              const header2 = ['date', ...slugs.flatMap(() => ['count', 'uniques'])];

              const sortedDates = [...allDates].filter(d => d).sort();
              const rows = sortedDates.map(date => {
                const existing = existingRows[date] || [];
                return [
                  date,
                  ...slugs.flatMap((slug, i) => {
                    const newData = repoData[slug][date];
                    if (newData) return [newData.count, newData.uniques];
                    const base = 1 + i * 2;
                    return [existing[base] || 0, existing[base + 1] || 0];
                  })
                ];
              });

              const repoTotals = slugs.map((slug, i) => {
                const base = 1 + i * 2;
                return {
                  count:   rows.reduce((s, r) => s + (parseInt(r[base])   || 0), 0),
                  uniques: rows.reduce((s, r) => s + (parseInt(r[base+1]) || 0), 0)
                };
              });

              const grandCount   = repoTotals.reduce((s, t) => s + t.count,   0);
              const grandUniques = repoTotals.reduce((s, t) => s + t.uniques, 0);

              const totalsRow = ['TOTAL', ...repoTotals.flatMap(t => [t.count, t.uniques])];

              fs.writeFileSync(filename,
                header1.join(',') + '\n' +
                header2.join(',') + '\n' +
                rows.map(r => r.join(',')).join('\n') + '\n' +
                totalsRow.join(',') + '\n'
              );

              return { rows, sortedDates, repoTotals, grandCount, grandUniques };
            }

            function generateChart(title, labels, datasets, outfile) {
              const width = 900, height = 400;
              const canvas = createCanvas(width, height);
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, width, height);

              new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                  responsive: false,
                  animation: false,
                  plugins: {
                    title: { display: true, text: title, font: { size: 16 } },
                    legend: { position: 'bottom' }
                  },
                  scales: {
                    x: { ticks: { maxRotation: 45 } },
                    y: { beginAtZero: true }
                  }
                }
              });

              fs.writeFileSync(outfile, canvas.toBuffer('image/png'));
            }

            const { rows: vRows, sortedDates: vDates } = buildCSV('views');
            const { rows: cRows, sortedDates: cDates } = buildCSV('clones');
            const vData = buildCSV('views');
            const cData = buildCSV('clones');

            generateChart('Views per day', vDates,
              slugs.flatMap((slug, i) => [
                {
                  label: slug + ' views',
                  data: vRows.map(r => parseInt(r[1 + i * 2]) || 0),
                  borderColor: COLORS[i * 2],
                  backgroundColor: COLORS[i * 2] + '22',
                  tension: 0.3, fill: false
                },
                {
                  label: slug + ' uniques',
                  data: vRows.map(r => parseInt(r[2 + i * 2]) || 0),
                  borderColor: COLORS[i * 2 + 1],
                  borderDash: [5, 5],
                  tension: 0.3, fill: false
                }
              ]),
              'charts/views.png'
            );

            generateChart('Clones per day', cDates,
              slugs.flatMap((slug, i) => [
                {
                  label: slug + ' clones',
                  data: cRows.map(r => parseInt(r[1 + i * 2]) || 0),
                  borderColor: COLORS[i * 2],
                  backgroundColor: COLORS[i * 2] + '22',
                  tension: 0.3, fill: false
                },
                {
                  label: slug + ' unique cloners',
                  data: cRows.map(r => parseInt(r[2 + i * 2]) || 0),
                  borderColor: COLORS[i * 2 + 1],
                  borderDash: [5, 5],
                  tension: 0.3, fill: false
                }
              ]),
              'charts/clones.png'
            );

            const files = fs.readdirSync('traffic').filter(f => f.endsWith('_raw.json'));
            files.forEach(f => fs.unlinkSync('traffic/' + f));

            const repoCards = slugs.map((slug, i) => [
              '<div style=\"border:1px solid #ddd;border-radius:8px;padding:16px;flex:1;min-width:180px;box-sizing:border-box\">',
              '<div style=\"font-size:11px;color:#666;word-break:break-all;margin-bottom:10px;font-weight:600\">' + slug + '</div>',
              '<table style=\"width:100%;border-collapse:collapse;font-size:13px\">',
              '<tr><td style=\"color:#888;padding:4px 0\">Views</td><td style=\"text-align:right;font-weight:700;font-size:16px;color:#6366f1\">' + vData.repoTotals[i].count + '</td></tr>',
              '<tr><td style=\"color:#888;padding:4px 0\">Unique visitors</td><td style=\"text-align:right;font-weight:700;font-size:16px;color:#6366f1\">' + vData.repoTotals[i].uniques + '</td></tr>',
              '<tr><td style=\"color:#888;padding:4px 0\">Clones</td><td style=\"text-align:right;font-weight:700;font-size:16px;color:#14b8a6\">' + cData.repoTotals[i].count + '</td></tr>',
              '<tr><td style=\"color:#888;padding:4px 0\">Unique cloners</td><td style=\"text-align:right;font-weight:700;font-size:16px;color:#14b8a6\">' + cData.repoTotals[i].uniques + '</td></tr>',
              '</table>',
              '</div>'
            ].join('')).join('');

            const grandCard = [
              '<div style=\"border:2px solid #6366f1;border-radius:12px;padding:24px;min-width:280px;width:340px;box-sizing:border-box;background:#f8f7ff\">',
              '<div style=\"font-size:14px;font-weight:700;color:#6366f1;margin-bottom:14px\">All repos combined</div>','<table style=\"width:100%;border-collapse:collapse;font-size:14px\">',
              '<tr><td style=\"color:#888;padding:10px 0\">Total views</td><td style=\"text-align:right;font-weight:700;font-size:22px;color:#6366f1\">' + vData.grandCount + '</td></tr>'
              '<tr><td style=\"color:#888;padding:10px 0\">Total unique visitors</td><td style=\"text-align:right;font-weight:700;font-size:22px;color:#6366f1\">' + vData.grandUniques + '</td></tr>',
              '<tr><td style=\"color:#888;padding:10px 0\">Total clones</td><td style=\"text-align:right;font-weight:700;font-size:22px;color:#14b8a6\">' + cData.grandCount + '</td></tr>',
              '<tr><td style=\"color:#888;padding:10px 0\">Total unique cloners</td><td style=\"text-align:right;font-weight:700;font-size:22px;color:#14b8a6\">' + cData.grandUniques + '</td></tr>',
              '</table>',
              '</div>'
            ].join('');

            fs.writeFileSync('index.html', [
              '<!DOCTYPE html>',
              '<html>',
              '<head>',
              '<title>Traffic Stats</title>',
              '<style>',
              'body{font-family:sans-serif;max-width:960px;margin:40px auto;padding:0 20px;color:#222}',
              'h1{font-size:24px;margin-bottom:4px}',
              'h2{font-size:18px;margin-top:36px;margin-bottom:12px;color:#333;border-bottom:1px solid #eee;padding-bottom:6px}',
              '.updated{color:#888;font-size:12px;margin-bottom:28px}',
              '.cards{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0 32px;align-items:stretch}',
              'img{width:100%;border:1px solid #eee;border-radius:8px;margin-bottom:24px}',
              '</style>',
              '</head>',
              '<body>',
              '<h1>Repo Traffic</h1>',
              '<p class=\"updated\">Last updated: ' + new Date().toUTCString() + '</p>',
              '<h2>Combined totals</h2>',
              '<div class=\"cards\">' + grandCard + '</div>',
              '<h2>Per repo totals</h2>',
              '<div class=\"cards\">' + repoCards + '</div>',
              '<h2>Views chart</h2>',
              '<img src=\"charts/views.png\" alt=\"Views chart\"/>',
              '<h2>Clones chart</h2>',
              '<img src=\"charts/clones.png\" alt=\"Clones chart\"/>',
              '</body>',
              '</html>'
            ].join('\n'));

            console.log('Done.');
          "

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic/ charts/ index.html
          git diff --cached --quiet || git commit -m "chore: archive traffic $(date +%F)"
          git push --force-with-lease

      - name: Trigger GitHub Pages redeploy
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sowmyachintakindi/TrafficStats/pages/deployments
