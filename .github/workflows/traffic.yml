name: Archive traffic data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and save traffic
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          REPO: sowmyachintakindi/PerfMLOps_Zero_Human_ML_Performance_Framework
        run: |
          mkdir -p traffic

          VIEWS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/traffic/views?per=day")
          CLONES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/traffic/clones?per=day")

          node -e "
            const fs = require('fs');

            function saveCSV(filename, newRows) {
              let existing = new Set();
              let allRows = [];

              if (fs.existsSync(filename)) {
                const lines = fs.readFileSync(filename, 'utf8').trim().split('\n');
                lines.slice(1).forEach(l => {
                  if (!l.startsWith('TOTAL')) {
                    existing.add(l.split(',')[0]);
                    allRows.push(l);
                  }
                });
              }

              const toAdd = newRows
                .filter(r => !existing.has(r.timestamp.split('T')[0]))
                .map(r => r.timestamp.split('T')[0] + ',' + r.count + ',' + r.uniques);

              allRows = [...allRows, ...toAdd];

              let totalCount = 0, totalUniques = 0;
              allRows.forEach(l => {
                const parts = l.split(',');
                totalCount   += parseInt(parts[1]) || 0;
                totalUniques += parseInt(parts[2]) || 0;
              });

              const content = 'date,count,uniques\n'
                + allRows.join('\n') + '\n'
                + 'TOTAL,' + totalCount + ',' + totalUniques + '\n';

              fs.writeFileSync(filename, content);
            }

            const views  = $VIEWS;
            const clones = $CLONES;

            saveCSV('traffic/views.csv',  views.views   || []);
            saveCSV('traffic/clones.csv', clones.clones || []);
          "

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic/
          git diff --cached --quiet || git commit -m "chore: archive traffic $(date +%F)"
          git push
