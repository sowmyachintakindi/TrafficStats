<!DOCTYPE html>
<html>
<head>
<title>Traffic Stats</title>
<style>
body { font-family: sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
h2 { margin-top: 40px; }
img { width: 100%; border: 1px solid #eee; border-radius: 8px; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; margin-top: 16px; }
th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
th { background: #f5f5f5; font-weight: 600; }
tr:nth-child(even) { background: #fafafa; }
tr:last-child td { font-weight: 600; background: #f0f0f0; }
.updated { color: #888; font-size: 13px; }
</style>
</head>
<body>
<h1>Repo Traffic</h1>
<p class="updated">Last updated: Fri, 29 May 2026 02:05:22 GMT</p>
<h2>Views</h2>
<img src="charts/views.png" alt="Views chart"/>
<h2>Clones</h2>
<img src="charts/clones.png" alt="Clones chart"/>
</body>
</html>
